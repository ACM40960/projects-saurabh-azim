# ============================================================
# MediGuide - CI/CD Pipeline
# Deploy Docker Image to Amazon EC2 using Amazon ECR
# ============================================================
#
# Pipeline:
#
# Push to main
#      ↓
# Continuous Integration
#      ↓
# Build Docker Image
#      ↓
# Push Image to Amazon ECR
#      ↓
# Continuous Deployment
#      ↓
# EC2 Self-Hosted Runner
#      ↓
# Pull and Run MediGuide Container
#
# ============================================================


name: Deploy MediGuide to Amazon EC2


# ============================================================
# Trigger
# ============================================================

# Run this workflow whenever code is pushed to main.
on:
  push:
    branches:
      - main


# ============================================================
# Jobs
# ============================================================

jobs:

  # ==========================================================
  # 1. Continuous Integration
  # ==========================================================
  #
  # Runs on a GitHub-hosted Ubuntu machine.
  #
  # Responsibilities:
  # - Checkout source code
  # - Authenticate with AWS
  # - Login to Amazon ECR
  # - Build Docker image
  # - Push Docker image to ECR
  # ==========================================================

  Continuous-Integration:

    runs-on: ubuntu-latest


    steps:

      # ------------------------------------------------------
      # Checkout Repository
      # ------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # ------------------------------------------------------
      # Configure AWS Credentials
      # ------------------------------------------------------

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4

        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}


      # ------------------------------------------------------
      # Login to Amazon ECR
      # ------------------------------------------------------

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2


      # ------------------------------------------------------
      # Build and Push Docker Image
      # ------------------------------------------------------

      - name: Build and push MediGuide Docker image

        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPO }}
          IMAGE_TAG: latest

        run: |

          echo "Building MediGuide Docker image..."

          docker build \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            .


          echo "Pushing MediGuide image to Amazon ECR..."

          docker push \
            $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG


  # ==========================================================
  # 2. Continuous Deployment
  # ==========================================================
  #
  # Runs directly on the EC2 self-hosted GitHub runner.
  #
  # This job starts only after Continuous-Integration
  # completes successfully.
  #
  # Responsibilities:
  # - Authenticate with AWS
  # - Login to Amazon ECR
  # - Pull the newest MediGuide Docker image
  # - Stop the previous container
  # - Start the latest MediGuide container
  # ==========================================================

  Continuous-Deployment:

    needs: Continuous-Integration

    runs-on: self-hosted


    steps:

      # ------------------------------------------------------
      # Checkout Repository
      # ------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # ------------------------------------------------------
      # Configure AWS Credentials
      # ------------------------------------------------------

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4

        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}


      # ------------------------------------------------------
      # Login to Amazon ECR
      # ------------------------------------------------------

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2


      # ------------------------------------------------------
      # Pull Latest Docker Image
      # ------------------------------------------------------

      - name: Pull latest MediGuide Docker image

        run: |

          docker pull \
            "${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REPO }}:latest"


      # ------------------------------------------------------
      # Stop Previous Container
      # ------------------------------------------------------

      - name: Stop existing MediGuide container

        run: |

          docker stop mediguide-app || true

          docker rm mediguide-app || true


      # ------------------------------------------------------
      # Run Latest MediGuide Container
      # ------------------------------------------------------

      - name: Start MediGuide application

        run: |

          docker run -d \
            --name mediguide-app \
            --restart unless-stopped \
            -p 8080:8080 \
            -e OPENAI_API_KEY="${{ secrets.OPENAI_API_KEY }}" \
            -e PINECONE_API_KEY="${{ secrets.PINECONE_API_KEY }}" \
            "${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REPO }}:latest"


      # ------------------------------------------------------
      # Verify Deployment
      # ------------------------------------------------------

      - name: Verify MediGuide container

        run: |

          echo "Running containers:"

          docker ps


          echo "Waiting for MediGuide to start..."

          sleep 10


          echo "Checking MediGuide health endpoint..."

          curl --fail http://127.0.0.1:8080/health