# MediGuide CI/CD Pipeline

name: Deploy MediGuide to EC2

# Run on push to main
on:
  push:
    branches:
      - main


jobs:

  # ==========================================================
  # Continuous Integration
  # Build Docker image and push it to Amazon ECR
  # ==========================================================

  Continuous-Integration:

    runs-on: ubuntu-latest

    steps:

      # Checkout source code
      - name: Checkout repository
        uses: actions/checkout@v4


      # Configure AWS authentication
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}


      # Login to Amazon ECR
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2


      # Build and push Docker image
      - name: Build and push MediGuide image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPO }}
          IMAGE_TAG: latest

        run: |
          echo "Building MediGuide Docker image..."

          docker build \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .

          echo "Pushing image to Amazon ECR..."

          docker push \
            $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG


  # ==========================================================
  # Continuous Deployment
  # Pull image from ECR and run it on EC2
  # ==========================================================

  Continuous-Deployment:

    needs: Continuous-Integration

    runs-on: self-hosted

    steps:

      # Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4


      # Configure AWS authentication
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}


      # Login to Amazon ECR
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2


      # Pull latest image
      - name: Pull latest MediGuide image
        run: |
          docker pull \
            "${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REPO }}:latest"


      # Remove old container
      - name: Stop previous MediGuide container
        run: |
          docker stop mediguide-app || true
          docker rm mediguide-app || true

          OLD_CONTAINER=$(docker ps -q --filter "publish=8080")

          if [ -n "$OLD_CONTAINER" ]; then
            docker stop "$OLD_CONTAINER" || true
            docker rm "$OLD_CONTAINER" || true
          fi


      # Start latest container
      - name: Run MediGuide container
        run: |
          docker run -d \
            --name mediguide-app \
            --restart unless-stopped \
            -p 8080:8080 \
            -e OPENAI_API_KEY="${{ secrets.OPENAI_API_KEY }}" \
            -e PINECONE_API_KEY="${{ secrets.PINECONE_API_KEY }}" \
            "${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REPO }}:latest"


      # Verify deployment
      - name: Verify MediGuide deployment
        run: |
          echo "Waiting for MediGuide..."
          sleep 15

          echo "Container status:"
          docker ps -a

          echo "Application logs:"
          docker logs mediguide-app

          echo "Testing health endpoint:"
          curl --fail http://127.0.0.1:8080/health